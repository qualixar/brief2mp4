name: Bug
description: A script, installer or the 3D pack fails
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: The command you ran and the full error output., render: text }
    validations: { required: true }
  - type: dropdown
    id: os
    attributes: { label: OS, options: [macOS, Windows, Linux, WSL] }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: brief2mp4 version, placeholder: "cat VERSION" }
  - type: textarea
    id: doctor
    attributes: { label: Doctor output, render: text }
